# ============================================================
# Backend 공통 테스트 Profile
# ============================================================
#
# 자동 테스트에서 실제 외부 서비스의 Secret을 사용하지 않기 위한
# 공통 테스트 전용 설정입니다.
#
# 실제 Kakao / AWS / AI 서비스를 호출하지 않는 테스트에서는
# 아래 dummy 값을 사용해 Spring Bean 생성에 필요한 설정만 제공합니다.
#
# DB 접속 정보는 이 파일에서 정의하지 않습니다.
# PostgreSQL 통합 테스트에서는 Testcontainers의 @ServiceConnection이
# JDBC URL / username / password를 자동으로 주입합니다.
# ============================================================

# JWT 테스트 전용 Secret
# JwtTokenProvider가 Base64 디코딩하여 사용하므로
# 테스트에서도 유효한 Base64 형식의 dummy 값을 사용한다.
jwt:
  secret: ZGFnYWNoaS10ZXN0LWp3dC1zZWNyZXQta2V5LTMyLWJ5dGVzISE=

# Kakao Local API 테스트용 dummy Key
# 일반 자동 테스트에서는 실제 Kakao API를 호출하지 않습니다.
KAKAO_REST_API_KEY: test-key

# AWS/S3 관련 테스트용 dummy 값
AWS_REGION: ap-northeast-2
AWS_S3_BUCKET: test-bucket
AWS_ACCESS_KEY_ID: test-access-key
AWS_SECRET_ACCESS_KEY: test-secret-key

# FastAPI AI Service 테스트용 주소
# 일반 Spring Context 테스트에서 실제 FastAPI를 호출하지 않도록
# 사용하지 않는 로컬 포트를 지정합니다.
AI_SERVICE_BASE_URL: http://localhost:9999

# 테스트에서 외부 HTTP 요청이 필요하지 않은 경우를 위한 기본값
KAKAO_LOCAL_BASE_URL: https://dapi.kakao.com

# 테스트 로그에서 SQL 확인이 가능하도록 유지합니다.
spring:
  jpa:
    properties:
      hibernate:
        format_sql: true