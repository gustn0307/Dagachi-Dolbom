spring:
  application:
    name: backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 32MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dagachi_dolbom}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:dagachi-dolbom-files-dev}

# FastAPI AI Service
#
# 로컬에서는 localhost:8000을 사용하고,
# 배포 환경에서는 AI_SERVICE_BASE_URL 환경변수로 덮어씁니다.
ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}