name: CI and Deploy to EC2

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # GitHub Actions Runner에 현재 commit의 소스 코드를 내려받습니다.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Backend는 Java 21을 기준으로 빌드·테스트합니다.
      # Gradle dependency cache도 함께 사용해 이후 실행 시간을 줄입니다.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Windows에서 생성된 저장소의 Gradle Wrapper에
      # Linux 실행 권한이 없을 가능성을 대비합니다.
      - name: Grant execute permission for Gradle Wrapper
        working-directory: backend
        run: chmod +x gradlew

      # JUnit / Mockito / AssertJ 테스트와
      # PostgreSQL + pgvector Testcontainers 통합 테스트를 실행합니다.
      #
      # build.gradle 설정에 의해 테스트 완료 후
      # JaCoCo report도 자동 생성됩니다.
      - name: Run Backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon
  
  ai-test:
    name: AI Service Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # 자동 테스트에서는 실제 OpenAI API를 호출하지 않습니다.
    # 애플리케이션 설정 객체 생성에 필요한 경우를 대비해 dummy 값을 사용합니다.
    env:
      OPENAI_API_KEY: test-key

    steps:
      # GitHub Actions Runner에 현재 commit의 소스 코드를 내려받습니다.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 현재 로컬 ai-service 개발 환경과 동일하게 Python 3.12를 사용합니다.
      # requirements.txt를 기준으로 pip dependency cache도 사용합니다.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      # FastAPI 애플리케이션과 pytest/TestClient 테스트에 필요한
      # Python dependency를 설치합니다.
      - name: Install AI Service dependencies
        working-directory: ai-service
        run: python -m pip install -r requirements.txt

      # pytest.ini 설정을 사용하여
      # Router / Service / FastAPI TestClient 테스트를 전체 실행합니다.
      - name: Run AI Service tests
        working-directory: ai-service
        run: python -m pytest

  frontend-e2e:
    name: Frontend E2E Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # GitHub Actions Runner에 현재 commit의 소스 코드를 내려받습니다.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Frontend는 Node.js 기반으로 실행합니다.
      # package-lock.json을 기준으로 npm dependency cache를 사용합니다.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json 기준으로 정확한 dependency를 설치합니다.
      # CI에서는 npm install보다 npm ci를 사용하는 것이 적합합니다.
      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      # Playwright가 사용할 Chromium 브라우저와
      # Linux 실행에 필요한 system dependency를 함께 설치합니다.
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # playwright.config.js의 webServer 설정을 사용하여
      # Vite 서버를 자동 실행한 뒤 Chromium E2E 테스트를 수행합니다.
      - name: Run Frontend E2E tests
        working-directory: frontend
        run: npm run test:e2e

  deploy:
    name: Deploy to EC2

    # Backend / AI / Frontend 세 테스트가 모두 성공해야
    # deploy job이 다음 단계로 진행될 수 있습니다.
    needs:
      - backend-test
      - ai-test
      - frontend-e2e

    # PR이나 workflow_dispatch에서는 배포하지 않습니다.
    # 실제 main branch에 push된 commit만 production 배포 대상으로 허용합니다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          command_timeout: 15m
          script: |
            set -e

            cd ~/apps/Dagachi-Dolbom

            git status --porcelain --untracked-files=normal | grep -q . && {
              echo "EC2 working tree is not clean. Deployment aborted."
              git status --short
              exit 1
            }

            git fetch origin main
            git checkout -B main ${{ github.sha }}

            test "$(git rev-parse HEAD)" = "${{ github.sha }}"

            echo "Deploying commit: $(git rev-parse HEAD)"

            docker compose \
              -f infra/docker-compose.prod.yml \
              --env-file .env \
              up -d --build

            docker compose \
              -f infra/docker-compose.prod.yml \
              --env-file .env \
              ps

            echo "Waiting for application readiness..."

            i=1
            while [ "$i" -le 12 ]; do
              if curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 5 \
                --max-time 10 \
                https://dolbom.hskang.dev/api/health/ready > /dev/null; then
                echo "Backend readiness check passed."
                exit 0
              fi

              echo "Backend is not ready yet. Retry $i/12..."
              sleep 5
              i=$((i + 1))
            done

            echo "Backend readiness check failed."
            docker compose \
              -f infra/docker-compose.prod.yml \
              --env-file .env \
              ps --all

            exit 1
