server {
    listen 80;
    server_name dolbom.hskang.dev;

    # HTTP 요청은 모두 HTTPS로 전환합니다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dolbom.hskang.dev;

    client_max_body_size 32m;

    # Cloudflare Origin Certificate
    ssl_certificate /etc/nginx/ssl/dolbom-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/dolbom-origin-key.pem;

    root /usr/share/nginx/html;
    index index.html;

    # React Router의 SPA 라우팅을 지원합니다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 브라우저에서 /api/... 로 요청하면
    # Docker 네트워크 내부의 Spring Boot backend로 전달합니다.
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 외부 사용자는 HTTPS로 접속하므로
        # Spring Boot에도 원래 프로토콜을 HTTPS로 전달합니다.
        proxy_set_header X-Forwarded-Proto https;
    }
}
